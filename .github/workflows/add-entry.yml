# Turns a submitted "data entry" issue form into a pull request against the
# data/*.json files. The conversion lives in the theme, at
# themes/dbaw/scripts/add_entry.py — this file only wires it up.
name: Add data entry from issue

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: data-entry-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  add-entry:
    # Only the repository owner can write to data/ this way, and only while
    # the issue is open — merging the pull request closes it, and an edit
    # after that would add the entry a second time.
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.164.0
      THEME: themes/dbaw
      BRANCH: data-entry/issue-${{ github.event.issue.number }}
      ISSUE: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet pyyaml jsonschema

      - name: Build the entry
        id: entry
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python "$THEME/scripts/add_entry.py" --issue "$ISSUE"

      - name: Install Hugo CLI
        if: steps.entry.outputs.status == 'added'
        run: |
          wget -q -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"

      # Pull requests opened with GITHUB_TOKEN do not trigger the deploy
      # workflow's pull_request build, so validate the site here instead.
      - name: Check that the site still builds
        if: steps.entry.outputs.status == 'added'
        run: hugo --minify --destination "${{ runner.temp }}/public"

      - name: Commit and push
        if: steps.entry.outputs.status == 'added'
        env:
          KIND: ${{ steps.entry.outputs.kind }}
          SUMMARY: ${{ steps.entry.outputs.summary }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          # Explicit paths, never `git add -A`: the theme submodule sits in the
          # same working tree and must not be swept into a data commit.
          git add data static/media
          git commit -m "Add ${KIND}: ${SUMMARY}" -m "From #${ISSUE}."
          # The branch is rebuilt from scratch every time the issue is edited.
          git push --force -u origin "$BRANCH"

      - name: Open or update the pull request
        if: steps.entry.outputs.status == 'added'
        env:
          FILE: ${{ steps.entry.outputs.file }}
          TITLE: "Add ${{ steps.entry.outputs.kind }}: ${{ steps.entry.outputs.summary }}"
        run: |
          {
            printf 'Adds one entry to `%s`, built from the issue form.\n\n' "$FILE"
            printf 'The site was built from this branch before the pull request was opened.\n\n'
            printf 'Closes #%s.\n' "$ISSUE"
          } > "${RUNNER_TEMP}/pr-body.md"

          existing=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$TITLE" --body-file "${RUNNER_TEMP}/pr-body.md"
            exit 0
          fi

          url=$(gh pr create --head "$BRANCH" \
                             --base "${{ github.event.repository.default_branch }}" \
                             --title "$TITLE" \
                             --body-file "${RUNNER_TEMP}/pr-body.md")
          {
            printf 'Added to `%s` in %s — review the diff there and merge to publish.\n\n' "$FILE" "$url"
            printf 'Editing this issue rebuilds the pull request.\n\n'
            printf -- '---\n_Generated by [Claude Code](https://claude.ai/code)_\n'
          } > "${RUNNER_TEMP}/comment.md"
          gh issue comment "$ISSUE" --body-file "${RUNNER_TEMP}/comment.md"

      - name: Report a failure back on the issue
        if: failure()
        env:
          MESSAGE: ${{ steps.entry.outputs.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            printf 'Could not turn this issue into a data entry.\n\n'
            if [ -n "$MESSAGE" ]; then
              printf '> %s\n\n' "$MESSAGE"
            fi
            printf 'See the [workflow run](%s) for details. Editing the issue tries again.\n\n' "$RUN_URL"
            printf -- '---\n_Generated by [Claude Code](https://claude.ai/code)_\n'
          } > "${RUNNER_TEMP}/failure.md"
          gh issue comment "$ISSUE" --body-file "${RUNNER_TEMP}/failure.md"
