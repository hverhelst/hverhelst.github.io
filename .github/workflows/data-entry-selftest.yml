# Guards the issue-form -> data/*.json machinery, which otherwise only runs
# when a real issue is filed.
name: Data entry self-test

on:
  push:
    branches: ["master"]
    paths:
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/scripts/**"
      - ".github/workflows/data-entry-selftest.yml"
      - "data/**"
  pull_request:
    paths:
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/scripts/**"
      - ".github/workflows/data-entry-selftest.yml"
      - "data/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet pyyaml
      - run: python .github/scripts/selftest.py
      - name: Check the working tree was left clean
        run: git diff --exit-code
