# Workflow for building and deploying the Hugo site (with LuaLaTeX CV) to GitHub Pages
name: Deploy Hugo site to Pages

on:
  # Runs every Sunday at 00:00
  schedule:
  - cron: "0 0 * * 0"

  pull_request:

  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.164.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Install TeX Live (LuaLaTeX)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-luatex texlive-latex-extra texlive-science texlive-fonts-recommended
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      # The CV writer ships with the theme, alongside the layouts and the
      # data-entry scripts. It builds from data/*.json in this repository —
      # including data/sections.json, the same file the site renders from, so
      # the PDF cannot quietly omit a section the website shows.
      - name: Compile CV
        run: bash themes/dbaw/compile_CV.sh
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          # Supplied here rather than committed to hugo.toml. The key is not a
          # secret in any real sense — it has to be in the deployed HTML for the
          # form to post at all — but keeping it out of the repository means it
          # never enters git history, so rotating it actually retires it.
          # Pull requests from forks get no secrets: those builds simply render
          # no form, which is harmless for a build check.
          HUGO_PARAMS_CONTACT_KEY: ${{ secrets.WEB3FORMS_KEY }}
        run: hugo --minify
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # Deployment job
  deploy:
    # Never deploy from pull-request builds; PRs only validate the build.
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
