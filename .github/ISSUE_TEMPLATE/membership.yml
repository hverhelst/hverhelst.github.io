name: Membership
description: Add a membership of a society, school or community.
title: "[membership] "
labels: ["data-entry", "awards"]
body:
  - type: input
    id: organization
    attributes:
      label: Organisation
      placeholder: Society of Industrial and Applied Mathematics (SIAM)
    validations:
      required: true

  - type: input
    id: member
    attributes:
      label: Membership type
      placeholder: Student member
    validations:
      required: true

  - type: input
    id: start
    attributes:
      label: Start date
      description: YYYY-MM-DD.
      placeholder: 2021-01-01
    validations:
      required: true

  - type: input
    id: end
    attributes:
      label: End date
      description: YYYY-MM-DD. Leave empty if it is ongoing.

  - type: input
    id: url
    attributes:
      label: URL
      placeholder: https://siam.org/

  - type: checkboxes
    id: featured
    attributes:
      label: Featured
      options:
        - label: Show this membership on the homepage
