name: Supervision
description: Add a student you supervised or examined.
title: "[supervision] "
labels: ["data-entry", "supervision"]
body:
  - type: input
    id: name
    attributes:
      label: Student
      placeholder: Lorenzo Cardinale
    validations:
      required: true

  - type: input
    id: title
    attributes:
      label: Thesis title
    validations:
      required: true

  - type: dropdown
    id: level
    attributes:
      label: Level
      options:
        - BSc
        - MSc
        - PhD
    validations:
      required: true

  - type: input
    id: degree
    attributes:
      label: Programme
      placeholder: Maritime Technology
    validations:
      required: true

  - type: input
    id: university
    attributes:
      label: University
      placeholder: Technische Universiteit Delft
    validations:
      required: true

  - type: input
    id: role
    attributes:
      label: Your role
      placeholder: Daily supervisor
    validations:
      required: true

  - type: input
    id: graduation
    attributes:
      label: Graduation date
      description: YYYY-MM-DD. Use the expected date for ongoing projects.
      placeholder: 2027-07-01
    validations:
      required: true

  - type: input
    id: cosupervisors
    attributes:
      label: Co-supervisors
      placeholder: dr. ir. J.H. Den Besten

  - type: input
    id: url
    attributes:
      label: URL
      description: The thesis in the repository.

  - type: checkboxes
    id: featured
    attributes:
      label: Featured
      options:
        - label: Show this entry on the homepage
