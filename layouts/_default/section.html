{{ define "main" }}
{{ partial "breadcrumbs" . }}
{{ $data := index hugo.Data .Section }}
<section class="resume-section p-3 p-lg-5 d-flex flex-column">
  <div class="my-auto">
    <h1 id="{{ urlize .Title }}">{{ .Title }}</h1>
    {{ partial (printf "%sSummary.html" .Section) (dict "pages" $data) }}
  </div>
</section>
{{ end }}
