<nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top" id="sideNav">
  <a class="navbar-brand js-scroll-trigger" href="#page-top">
    <span class="d-block d-lg-none">{{ .Site.Params.firstName }} {{ .Site.Params.lastName }}</span>
    <span class="d-none d-lg-block">
      <img class="img-fluid img-profile rounded-circle mx-auto mb-2" src="{{ .Site.Params.profileImage | relURL }}" alt="profile image">
    </span>
  </a>
  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>
  <div class="collapse navbar-collapse" id="navbarSupportedContent">
    {{ $page := . }}
    <ul class="navbar-nav">
      <li class="nav-item">
        <a class="nav-link js-scroll-trigger" href="{{ if $page.IsHome }}#about{{ else }}/#about{{ end }}">{{ i18n "about" }}</a>
      </li>
      {{ range .Site.Params.sections }}
      <li class="nav-item">
        <a class="nav-link js-scroll-trigger" href="{{ if $page.IsHome }}#{{ . }}{{ else }}/#{{ . }}{{ end }}">{{ . | i18n }}</a>
      </li>
      {{ end }}
      {{ if .Site.Params.CVlink}}
        <li class="nav-item">
          <a class="nav-link" href="{{ .Site.Params.CVlink | relURL }}">{{ i18n "CV" }}</a>
        </li>
      {{ end }}
      <li class="nav-item mt-2">
        <button type="button" class="theme-toggle" id="themeToggle" aria-live="polite">
          <i class="fas fa-circle-half-stroke" aria-hidden="true"></i>
          <span id="themeToggleLabel">Dark mode</span>
        </button>
      </li>
    </ul>
  </div>
</nav>
