# Contact form instead of a published address.
#
# The key is deliberately empty here: it is injected at build time from the
# WEB3FORMS_KEY repository secret, via HUGO_PARAMS_CONTACT_KEY in
# .github/workflows/hugo.yml, so it never enters this repository's history.
#
# It is not a secret in the usual sense — the browser has to send it, so it is
# in the deployed HTML and visible in View Source either way. Keeping it out of
# git means rotating it actually retires the old one.
#
# TODO before merging: create the key at https://web3forms.com and add it as the
# WEB3FORMS_KEY repository secret. Until then the site has no contact route.
#
# To preview locally:  HUGO_PARAMS_CONTACT_KEY=your-key hugo server
[params.contact]
provider = "web3forms"
key = ""
subject = "Message from hugoverhelst.nl"

[[params.extraPages]]
label = "Contact"
url = "/contact/"

[params.meta]
description = "Hugo Verhelst's personal website"
author      = "Hugo Verhelst"
favicon     = true

[markup.goldmark.renderer]
unsafe = true
